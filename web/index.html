<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Inventário FabLab</title>
        <link rel="stylesheet" href="inventory.css" />
        <script type="module" src="inventory.js"></script>
    </head>
    <body>
        <header class="bar">
            <div class="bar-content">
                <span class="brand">Inventário FabLab</span>
                <button id="logout" class="secondary" type="button" hidden>Sair</button>
            </div>
        </header>
        <main>
            <section id="login" class="panel login" aria-labelledby="login-title">
                <h1 id="login-title">Entre na sua conta</h1>
                <form id="login-form" method="post">
                    <label for="email">E-mail</label>
                    <input id="email" name="email" type="email" autocomplete="username" maxlength="254" required />
                    <label for="password">Senha</label>
                    <input id="password" name="password" type="password" autocomplete="current-password" required />
                    <button id="login-button" type="submit">Entrar</button>
                </form>
                <p id="login-status" role="status"></p>
            </section>
            <section id="inventory" aria-labelledby="inventory-title" hidden>
                <div class="inventory-heading">
                    <h1 id="inventory-title" tabindex="-1">Estoque de itens</h1>
                    <button id="create-item" type="button" aria-haspopup="dialog">Cadastrar item</button>
                </div>
                <p id="item-result" role="status"></p>
                <div class="panel">
                    <search>
                        <form id="search-form">
                            <div class="search-controls">
                                <div class="search-term">
                                    <label for="search">Nome, categoria ou localização</label>
                                    <input id="search" name="search" type="search" maxlength="100" />
                                </div>
                                <div>
                                    <label for="availability">Disponibilidade</label>
                                    <select id="availability" name="availability">
                                        <option value="">Todos os itens</option>
                                        <option value="available">Disponíveis</option>
                                        <option value="unavailable">Indisponíveis</option>
                                    </select>
                                </div>
                                <div>
                                    <label for="order">Ordenação</label>
                                    <select id="order" name="order">
                                        <option value="desc">Mais novos</option>
                                        <option value="asc">Mais antigos</option>
                                    </select>
                                </div>
                                <button type="submit">Buscar</button>
                            </div>
                        </form>
                    </search>
                    <p id="inventory-status" role="status"></p>
                    <!-- biome-ignore lint/a11y/noNoninteractiveTabindex: A tabela precisa receber foco para permitir rolagem pelo teclado. -->
                    <section id="table-region" class="table-region" aria-label="Tabela do estoque" tabindex="0" hidden>
                        <p class="table-hint">Role a tabela para ver categoria e localização.</p>
                        <table aria-label="Estoque de itens">
                            <thead>
                                <tr>
                                    <th scope="col">Item</th>
                                    <th scope="col">Disponível</th>
                                    <th scope="col">Total</th>
                                    <th scope="col">Categoria</th>
                                    <th scope="col">Localização</th>
                                </tr>
                            </thead>
                            <tbody id="items"></tbody>
                        </table>
                    </section>
                    <nav id="pagination" class="pagination" aria-label="Páginas do estoque" hidden>
                        <button id="previous" class="secondary" type="button" disabled>Anterior</button>
                        <span id="page" tabindex="-1">Página 1</span>
                        <button id="next" class="secondary" type="button" disabled>Próxima</button>
                    </nav>
                </div>
                <dialog id="item-dialog" class="panel" aria-labelledby="item-dialog-title">
                    <h2 id="item-dialog-title">Cadastrar item</h2>
                    <form id="item-form" method="dialog">
                        <fieldset id="item-fields" aria-label="Dados do item">
                            <label for="item-name">Nome do item</label>
                            <input id="item-name" name="name" minlength="2" maxlength="50" required />
                            <label for="item-location">Localização</label>
                            <input id="item-location" name="location" maxlength="80" required />
                            <label for="item-category">Categoria (opcional)</label>
                            <input id="item-category" name="category" maxlength="30" />
                            <p id="item-registered-quantity" hidden></p>
                            <label for="item-quantity">Quantidade total</label>
                            <input id="item-quantity" name="totalQuantity" type="number" min="0" max="2147483647" step="1" aria-describedby="item-registered-quantity" required />
                            <div id="item-adjustment" hidden>
                                <label for="item-adjustment-reason">Motivo do ajuste</label>
                                <input id="item-adjustment-reason" name="adjustmentReason" minlength="3" maxlength="200" disabled />
                            </div>
                        </fieldset>
                        <p id="item-form-status" role="status"></p>
                        <div class="dialog-actions">
                            <button id="open-active-loans" class="secondary" type="button" aria-haspopup="dialog" hidden>Empréstimos ativos</button>
                            <button id="open-adjustment-history" class="secondary" type="button" aria-haspopup="dialog" hidden>Histórico de ajustes</button>
                            <button id="cancel-item" class="secondary" type="button">Voltar ao estoque</button>
                            <button id="save-item" type="submit">Salvar item</button>
                        </div>
                    </form>
                </dialog>
                <dialog id="item-records" class="panel" aria-labelledby="records-title">
                    <div class="inventory-heading">
                        <h2 id="records-title">Registros do item</h2>
                        <form method="dialog">
                            <button id="close-item-records" class="secondary" type="submit">Voltar ao item</button>
                        </form>
                    </div>
                    <p id="records-item"></p>
                    <div id="loan-records-filters" hidden>
                        <label for="loan-records-status">Situação dos empréstimos</label>
                        <select id="loan-records-status">
                            <option value="active">Todos os ativos</option>
                            <option value="overdue">Atrasados</option>
                        </select>
                    </div>
                    <p id="records-result" role="status"></p>
                    <p id="records-status" role="status"></p>
                    <!-- biome-ignore lint/a11y/noNoninteractiveTabindex: Os registros precisam receber foco para rolar pelo teclado. -->
                    <section id="records-region" aria-label="Registros do item" tabindex="0" hidden>
                        <ul id="records-entries"></ul>
                    </section>
                    <nav id="records-pagination" class="pagination" aria-label="Páginas dos registros do item" hidden>
                        <button id="records-previous" class="secondary" type="button" disabled>Anterior</button>
                        <span id="records-page" tabindex="-1">Página 1</span>
                        <button id="records-next" class="secondary" type="button" disabled>Próxima</button>
                    </nav>
                </dialog>
            </section>
        </main>
        <noscript><p>Ative o JavaScript para consultar o estoque.</p></noscript>
    </body>
</html>
