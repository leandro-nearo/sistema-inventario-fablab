openapi: 3.1.0
info:
  title: Sistema de Inventário FabLab
  version: 2.0.0
  description: API de inventário, clientes e empréstimos.
  license:
    name: ISC
    identifier: ISC
servers:
  - url: http://localhost:3000
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Users
  - name: Clients
  - name: Items
  - name: Loans
  - name: Health
paths:
  /health/live:
    get:
      security: []
      tags: [Health]
      summary: Verifica se o processo está ativo
      responses:
        "200":
          description: Processo ativo
  /health/ready:
    get:
      security: []
      tags: [Health]
      summary: Verifica a conexão com o banco
      responses:
        "200":
          description: Aplicação pronta
        "503":
          description: Banco de dados indisponível
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/login:
    post:
      security: []
      tags: [Auth]
      summary: Autentica um usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tokens"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/refresh:
    post:
      security: []
      tags: [Auth]
      summary: Rotaciona o refresh token
      requestBody:
        $ref: "#/components/requestBodies/RefreshToken"
      responses:
        "200":
          description: Tokens rotacionados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tokens"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/logout:
    post:
      security: []
      tags: [Auth]
      summary: Revoga um refresh token
      requestBody:
        $ref: "#/components/requestBodies/RefreshToken"
      responses:
        "204":
          description: Token revogado ou já inexistente
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
  /auth/logout-all:
    post:
      tags: [Auth]
      summary: Revoga todas as sessões do usuário
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Sessões revogadas
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/me:
    get:
      tags: [Auth]
      summary: Retorna a conta autenticada e seu papel atual
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Identidade da sessão
          content:
            application/json:
              schema:
                type: object
                required: [id, role]
                properties:
                  id:
                    type: integer
                  role:
                    type: string
                    enum: [ADMIN, OPERATOR]
        "401":
          $ref: "#/components/responses/Unauthorized"
  /user:
    post:
      tags: [Users]
      summary: Cria um operador (ADMIN)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserInput"
      responses:
        "201":
          description: Usuário criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
    get:
      tags: [Users]
      summary: Lista usuários (ADMIN)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: Usuários
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "403":
          $ref: "#/components/responses/Forbidden"
  /user/me/password:
    patch:
      tags: [Users]
      summary: Altera a própria senha e revoga sessões
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "204":
          description: Senha alterada
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
  /user/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Users]
      summary: Obtém um usuário (ADMIN)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Usuário
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Users]
      summary: Atualiza um usuário (ADMIN)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserInput"
      responses:
        "200":
          description: Usuário atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
    delete:
      tags: [Users]
      summary: Remove um usuário (ADMIN)
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Usuário removido
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /client:
    get:
      tags: [Clients]
      summary: Lista clientes
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Search"
        - name: email
          in: query
          description: Busca o e-mail completo, sem distinguir maiúsculas de minúsculas.
          schema:
            type: string
            format: email
            maxLength: 254
      responses:
        "200":
          description: Clientes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      tags: [Clients]
      summary: Cria um cliente
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientInput"
      responses:
        "201":
          description: Cliente criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
  /client/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Clients]
      summary: Obtém um cliente
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Cliente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Clients]
      summary: Atualiza um cliente
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateClientInput"
      responses:
        "200":
          description: Cliente atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
    delete:
      tags: [Clients]
      summary: Remove um cliente sem histórico (ADMIN)
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Cliente removido
        "409":
          $ref: "#/components/responses/Conflict"
  /client/{id}/loans:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Clients]
      summary: Obtém o histórico do cliente
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Cliente com empréstimos
        "404":
          $ref: "#/components/responses/NotFound"
  /item:
    get:
      tags: [Items]
      summary: Lista itens
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Search"
        - name: availability
          in: query
          description: Use `available` para saldo disponível maior que zero ou `unavailable` para saldo disponível zero. Omita para listar todos os itens.
          schema:
            type: string
            enum: [available, unavailable]
        - name: order
          in: query
          description: Ordem por ID.
          schema:
            type: string
            enum: [asc, desc]
            default: asc
      responses:
        "200":
          description: Itens
          headers:
            X-Has-Next-Page:
              $ref: "#/components/headers/HasNextPage"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Item"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      tags: [Items]
      summary: Cria um item
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateItemInput"
      responses:
        "201":
          description: Item criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
  /item/by-category:
    get:
      tags: [Items]
      summary: Filtra itens por categoria
      security:
        - bearerAuth: []
      parameters:
        - name: category
          in: query
          required: true
          description: Categoria completa, sem distinção entre maiúsculas e minúsculas.
          schema:
            type: string
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Itens
  /item/by-location:
    get:
      tags: [Items]
      summary: Filtra itens por localização
      security:
        - bearerAuth: []
      parameters:
        - name: location
          in: query
          required: true
          description: Localização completa, sem distinção entre maiúsculas e minúsculas.
          schema:
            type: string
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Itens
  /item/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Items]
      summary: Obtém um item
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Items]
      summary: Atualiza um item e preserva as unidades emprestadas
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateItemInput"
      responses:
        "200":
          description: Item atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
    delete:
      tags: [Items]
      summary: Remove um item sem histórico (ADMIN)
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Item removido
        "409":
          $ref: "#/components/responses/Conflict"
  /item/{id}/adjustments:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Items]
      summary: Lista ajustes de quantidade de um item (ADMIN)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Ajustes de inventário
          headers:
            X-Has-Next-Page:
              $ref: "#/components/headers/HasNextPage"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryAdjustment"
        "404":
          $ref: "#/components/responses/NotFound"
  /loan:
    get:
      tags: [Loans]
      summary: Lista empréstimos
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: status
          in: query
          description: upcoming filtra empréstimos ativos cujo prazo vence entre o horário atual do servidor e as próximas 168 horas, incluindo os limites.
          schema:
            type: string
            enum: [all, active, returned, cancelled, overdue, upcoming]
            default: all
        - name: itemId
          in: query
          description: Filtra empréstimos pelo ID do item.
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
        - name: clientId
          in: query
          description: Filtra empréstimos pelo ID do cliente. Pode ser combinado com itemId e status.
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
        - name: include
          in: query
          description: Inclui o nome do cliente, o nome do item ou o nome e a localização do item. Combine client com item ou itemLocation por meio de uma vírgula.
          schema:
            type: string
            enum: [client, item, "client,item", "item,client", itemLocation, "client,itemLocation", "itemLocation,client"]
        - name: order
          in: query
          description: recent ordena da data de empréstimo mais nova à mais antiga. due ordena do vencimento mais antigo ao mais novo.
          schema:
            type: string
            enum: [recent, due]
            default: recent
      responses:
        "200":
          description: Empréstimos
          headers:
            X-Has-Next-Page:
              $ref: "#/components/headers/HasNextPage"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LoanListEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      tags: [Loans]
      summary: Cria um empréstimo e reserva estoque
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          description: UUID por cadastro. Repetir a chave e os mesmos dados com a mesma conta retorna o empréstimo já criado.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLoanInput"
      responses:
        "200":
          description: Empréstimo já criado por esta conta com a mesma chave e os mesmos dados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Loan"
        "201":
          description: Empréstimo criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Loan"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Chave já usada por esta conta com outros dados válidos (IDEMPOTENCY_KEY_CONFLICT)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
  /loan/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Loans]
      summary: Obtém um empréstimo
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Empréstimo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Loan"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Loans]
      summary: Atualiza datas, devolve ou reabre um empréstimo
      description: Se expectedUpdatedAt for informado e o empréstimo estiver em outra versão, retorna LOAN_CHANGED.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ExpectedLoanUpdatedAt"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLoanInput"
      responses:
        "200":
          description: Empréstimo atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Loan"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
    delete:
      tags: [Loans]
      summary: Cancela sem apagar o histórico (ADMIN)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ExpectedLoanUpdatedAt"
      responses:
        "204":
          description: Empréstimo cancelado
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A versão do empréstimo mudou desde a consulta (LOAN_CHANGED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /loan/{id}/reopenings:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Loans]
      summary: Lista o histórico de reaberturas (ADMIN)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Reaberturas da mais recente para a mais antiga
          headers:
            X-Has-Next-Page:
              $ref: "#/components/headers/HasNextPage"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LoanReopening"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /loan/{id}/return:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Loans]
      summary: Registra a devolução de um empréstimo
      description: |
        Usa a data e hora do servidor. Uma nova chamada para um empréstimo já devolvido preserva a data e a conta responsável.
        Uma data de empréstimo futura impede a devolução e retorna INVALID_LOAN_DATES.
        Se expectedUpdatedAt for informado e o empréstimo ativo estiver em outra versão, retorna LOAN_CHANGED.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ExpectedLoanUpdatedAt"
      responses:
        "200":
          description: Empréstimo devolvido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Loan"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /loan/{id}/renew:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Loans]
      summary: Prorroga o prazo de um empréstimo ativo
      description: |
        Envie o updatedAt da última consulta e um novo prazo futuro e posterior ao atual.
        Uma versão mais recente de um empréstimo ativo só retorna 200 quando já tem o prazo solicitado.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedUpdatedAt, dueDate]
              additionalProperties: false
              properties:
                expectedUpdatedAt:
                  type: string
                  description: Valor de updatedAt obtido na consulta do empréstimo.
                dueDate:
                  type: string
                  description: Novo prazo em YYYY-MM-DD ou com data e hora ISO, segundos e fuso.
      responses:
        "200":
          description: Empréstimo com o novo prazo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Loan"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Registro alterado por outra operação ou empréstimo já devolvido ou cancelado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
components:
  headers:
    HasNextPage:
      description: Indica se há outra página de registros para os filtros aplicados.
      schema:
        type: boolean
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ExpectedLoanUpdatedAt:
      name: expectedUpdatedAt
      in: query
      description: Valor de updatedAt obtido na consulta do empréstimo.
      schema:
        type: string
        format: date-time
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Search:
      name: search
      in: query
      description: Busca por trecho literal, sem distinção entre maiúsculas e minúsculas.
      schema:
        type: string
        maxLength: 100
  requestBodies:
    RefreshToken:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [refreshToken]
            properties:
              refreshToken:
                type: string
  responses:
    BadRequest:
      description: Requisição inválida
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Não autenticado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Acesso negado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Recurso não encontrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Conflito de regra de negócio ou integridade
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PayloadTooLarge:
      description: Corpo JSON acima do limite configurado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnsupportedMediaType:
      description: Codificação do corpo JSON não suportada
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Limite de requisições excedido
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
    Tokens:
      type: object
      required: [accessToken, refreshToken]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
    LoginInput:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    CreateUserInput:
      type: object
      additionalProperties: false
      required: [username, email, password, passwordConfirm]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 24
          pattern: "^[a-zA-Z0-9._-]+$"
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
          format: password
        passwordConfirm:
          type: string
          format: password
        role:
          type: string
          enum: [ADMIN, OPERATOR]
    UpdateUserInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [ADMIN, OPERATOR]
    ChangePasswordInput:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword, passwordConfirm]
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          minLength: 12
          format: password
        passwordConfirm:
          type: string
          format: password
    User:
      type: object
      required: [id, username, email, role, createdAt, updatedAt]
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [ADMIN, OPERATOR]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ClientInput:
      type: object
      additionalProperties: false
      required: [name, email]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 50
        email:
          type: string
          format: email
        phone:
          type: [string, "null"]
    UpdateClientInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 50
        email:
          type: string
          format: email
        phone:
          type: [string, "null"]
    Client:
      type: object
      required: [id, name, email, phone, createdAt, updatedAt]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateItemInput:
      type: object
      additionalProperties: false
      required: [name, totalQuantity, location]
      properties:
        name:
          type: string
        category:
          type: string
        totalQuantity:
          type: integer
          minimum: 0
          maximum: 2147483647
        location:
          type: string
    UpdateItemInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
        category:
          type: [string, "null"]
        totalQuantity:
          type: integer
          minimum: 0
          maximum: 2147483647
        expectedTotalQuantity:
          description: Total consultado antes do ajuste. Use com totalQuantity. A API retorna 409 com ITEM_QUANTITY_CHANGED se o total tiver mudado.
          type: integer
          minimum: 0
          maximum: 2147483647
        expectedFields:
          description: Valores consultados dos campos que também serão atualizados. A API retorna 409 com ITEM_FIELDS_CHANGED se algum valor tiver mudado.
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            name:
              type: string
            category:
              type: [string, "null"]
            location:
              type: string
        adjustmentReason:
          type: string
          minLength: 3
          maxLength: 200
        location:
          type: string
    Item:
